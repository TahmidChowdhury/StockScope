<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101218">
    <meta name="color-scheme" content="dark">
    <title>Connection unavailable — StockScope</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: #101218; color: #e2e8f0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
      main { max-width: 380px; }
      .brand { color: #b6c8ab; font-weight: 600; letter-spacing: -.025em; }
      h1 { margin-top: 28px; font-size: 28px; line-height: 1.2; letter-spacing: -.03em; }
      p { color: #94a3b8; font-size: 16px; line-height: 1.6; }
      button { min-height: 48px; width: 100%; margin-top: 16px; border: 0; border-radius: 12px; background: #b6c8ab; color: #111613; font: inherit; font-weight: 600; cursor: pointer; touch-action: manipulation; }
      button:focus-visible, a:focus-visible { outline: 3px solid #b6c8ab; outline-offset: 4px; }
      a { display: inline-flex; min-height: 48px; align-items: center; margin-top: 12px; color: #b6c8ab; text-underline-offset: 4px; }
      #status { min-height: 26px; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">StockScope</div>
      <h1>StockScope can’t connect</h1>
      <p>Check your internet connection, then reload your research.</p>
      <button id="retry" type="button">Reload page</button>
      <p id="status" role="status" aria-live="polite"></p>
      <a href="/">Back to overview</a>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', () => {
        if (location.pathname === '/offline.html') location.replace('/');
        else location.reload();
      });
      window.addEventListener('online', () => {
        document.getElementById('status').textContent = 'Connection restored. Reload the page to continue.';
      });
      window.addEventListener('offline', () => {
        document.getElementById('status').textContent = 'Still offline. Check Wi-Fi or cellular data.';
      });
    </script>
  </body>
</html>
